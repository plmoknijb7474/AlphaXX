{% extends 'layout.html' %}{% block content %}
<section class="auth-wrap"><div class="auth-card">
  <div class="brand big"><span class="brand-mark brand-wordmark">AlphaX</span><span>ADMIN <small>ADMIN ACCESS</small></span></div>
  <h1>Admin Sign In</h1><p class="muted">This area is restricted to platform administrators.</p>
  {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" type="submit">Sign in securely</button>
  </form>
</div></section>
{% endblock %}
